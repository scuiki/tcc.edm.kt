            - paragraph [ref=e88]:
              - text: The
              - strong [ref=e90]: 2nd CSEDM Data Challenge
              - text: has been launched at the
              - link "5th CSEDM Workshop" [ref=e92] [cursor=pointer]:
                - /url: https://www.google.com/url?q=https%3A%2F%2Fsites.google.com%2Fncsu.edu%2Fcsedm-workshop-edm21&sa=D&sntz=1&usg=AOvVaw0hiiJxBwjzv8UAJ5Ve0wzJ
              - text: . The goal of the challenge is to develop new modeling techniques to predict students' learning outcomes in CS/programming classrooms, based on their submissions to and performance on past programming problems. We hope to bring together researchers at the intersection of AI/ML, Educational Data Mining (EDM), Learning Analytics and Computing Education to develop advances that can directly impact CS classrooms. This year's challenge will feature a larger dataset and multiple submission tracks.
            - paragraph [ref=e93]:
              - text: This challenge builds on the
              - link "1st Data Challenge" [ref=e95] [cursor=pointer]:
                - /url: https://www.google.com/url?q=https%3A%2F%2Fgithub.com%2Fthomaswp%2FCSEDM2019-Data-Challenge&sa=D&sntz=1&usg=AOvVaw0q0mQcjRSDtKGqA7QwWogu
              - text: ", where participants competed to create the best student model to predict programming performance. We had"
              - link "four entries and one winner" [ref=e97] [cursor=pointer]:
                - /url: https://www.google.com/url?q=https%3A%2F%2Fsites.google.com%2Fasu.edu%2Fcsedm-ws-lak-2019%2Faccepted-papers%3Fauthuser%3D0&sa=D&sntz=1&usg=AOvVaw33DlKURVSZBEzjn8GvovPf
              - text: ", which were presented at the 2nd CSEDM Workshop."
            - paragraph [ref=e98]:
              - strong [ref=e100]: "Update (6/1/22):"
