                - text: "Two Tracks: Knowledge Tracing and Final Grade Prediction"
            - paragraph [ref=e87]:
              - text: The Data Challenge will consist of related tracks, each with a separate modeling goal. Participants can submit to either or both of these tracks, which may benefit from the same modeling approaches. Both tracks involve using previous students' programming process data to model student learning and predict whether students will succeed in future tasks. This is a central challenge of student modeling, in particular knowledge tracing [
              - link "Corbett & Anderson" [ref=e89] [cursor=pointer]:
                - /url: https://www.google.com/url?q=https%3A%2F%2Flink.springer.com%2Fcontent%2Fpdf%2F10.1007%2FBF01099821.pdf&sa=D&sntz=1&usg=AOvVaw2Y0Ye7q8O4n3ta7yUe-q0p
              - text: "]. The two proposed"
              - link "tracks" [ref=e91] [cursor=pointer]:
                - /url: /ncsu.edu/csedm-dc-2021/tracks
              - text: "are:"
            - list [ref=e92]:
              - listitem [ref=e93]:
                - paragraph [ref=e94]:
                  - strong [ref=e96]: "Track 1: Knowledge Tracing"
                  - strong [ref=e98]: ":"
                  - text: predicting a students' performance on a problem before they start it, based on their performance on prior problems.
              - listitem [ref=e99]:
                - paragraph [ref=e100]:
                  - strong [ref=e102]: "Track 2: Early Grade Prediction"
                  - strong [ref=e104]: ":"
                  - text: predicting students' final exam grades in the course near the halfway point of the course.
            - paragraph [ref=e105]
            - paragraph [ref=e106]:
              - strong [ref=e108]: Why it matters
              - text: ": Predictive student models can be used to enable mastery learning ["
              - link "Corbett & Anderson" [ref=e110] [cursor=pointer]:
                - /url: https://www.google.com/url?q=https%3A%2F%2Flink.springer.com%2Fchapter%2F10.1007%2F3-540-55606-0_49&sa=D&sntz=1&usg=AOvVaw1nFT9wqew2ZQLWrG7yyOZQ
              - text: "], to make adaptive or feedback that targets struggling students ["
              - link "Murray & VanLehn" [ref=e112] [cursor=pointer]:
                - /url: https://www.google.com/url?q=https%3A%2F%2Flink.springer.com%2Fchapter%2F10.1007%2F11774303_12&sa=D&sntz=1&usg=AOvVaw2KmPe87h71_hYO023HLvew
              - text: "], or to encourage students through an open learner model ["
              - link "Brusilovsky et al." [ref=e114] [cursor=pointer]:
                - /url: https://www.google.com/url?q=https%3A%2F%2Fieeexplore.ieee.org%2Fabstract%2Fdocument%2F7359179%2F&sa=D&sntz=1&usg=AOvVaw1DYSZZo7FSVxO3Os05tosc
              - text: "]. They can also be used to identify students at risk of failure early in a course ["
              - link "Mao et al." [ref=e116] [cursor=pointer]:
                - /url: https://www.google.com/url?q=https%3A%2F%2Ffiles.eric.ed.gov%2Ffulltext%2FED599220.pdf&sa=D&sntz=1&usg=AOvVaw32EZDXRwHB7lQsvRNfffn7
              - text: "]. While similar knowledge tracing tasks have been attempted in many domains (including programming), they usually rely on labels for each problem, identifying which Knowledge Components (KCs), or domain concepts, are required by that problem (e.g. in ["
              - link "Kasurinen & Nikula" [ref=e118] [cursor=pointer]:
                - /url: https://www.google.com/url?q=https%3A%2F%2Fdl.acm.org%2Fdoi%2Fpdf%2F10.1145%2F1595496.1562972&sa=D&sntz=1&usg=AOvVaw0_tdkJ49lvVvahsUmCtGXK
              - text: "])."
            - paragraph [ref=e119]
            - paragraph [ref=e120]:
              - text: The specific goal of this Data Challenge is to leverage CS-specific aspects of the data, namely the source code, to build a model without these KC labels, as was attempted in [
              - link "Yudelson et al." [ref=e122] [cursor=pointer]:
                - /url: https://www.google.com/url?q=https%3A%2F%2Feducationaldatamining.org%2FEDM2014%2Fuploads%2Fprocs2014%2Fshort%2520papers%2F261_EDM-2014-Short.pdf&sa=D&sntz=1&usg=AOvVaw2_is3xK2txMp4yKob1OTdj
              - text: ","
              - link "Rivers et al." [ref=e124] [cursor=pointer]:
                - /url: https://www.google.com/url?q=https%3A%2F%2Fdl.acm.org%2Fdoi%2F10.1145%2F2960310.2960333&sa=D&sntz=1&usg=AOvVaw2-KlHpWHCnHUa4yMgWCra_
              - text: "]. For example, one approach is to automatically extract concepts from code (e.g. \"loop\", \"conditional\") to use in a model of student knowledge, as in ["
              - link "Rivers et al." [ref=e126] [cursor=pointer]:
                - /url: https://www.google.com/url?q=https%3A%2F%2Fdl.acm.org%2Fdoi%2F10.1145%2F2960310.2960333&sa=D&sntz=1&usg=AOvVaw2-KlHpWHCnHUa4yMgWCra_
              - text: ","
              - link "Berges & Hubwieser" [ref=e128] [cursor=pointer]:
                - /url: https://www.google.com/url?q=https%3A%2F%2Fdl.acm.org%2Fdoi%2F10.1145%2F2729094.2742619&sa=D&sntz=1&usg=AOvVaw2uM99GtZ_yrR_gZUdObELv
              - text: ","
              - link "Hosseini & Brusilovsky" [ref=e130] [cursor=pointer]:
                - /url: http://www.google.com/url?q=http%3A%2F%2Fceur-ws.org%2FVol-1009%2Faied2013ws_volume9.pdf%23page%3D64&sa=D&sntz=1&usg=AOvVaw18MXVQo9xoVKpH25gsI9hx
              - text: "]."
            - paragraph [ref=e131]
            - 'heading "Track 1: Knowledge Tracing" [level=3]':
              - generic [ref=e132]:
                - generic:
                  - generic:
                    - button:
                      - generic:
