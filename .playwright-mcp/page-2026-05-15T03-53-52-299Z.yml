              - text: ). Your submission should be a .zip folder with a single predictions.csv file. The file should be based on the Test dataset's late.csv file, with an additional column, Label, including your prediction as a
              - strong [ref=e217]: continuous
              - generic [ref=e218]:
                - text: value between 0 (struggle) and 1 (success). An example submission can be found in the
                - link [ref=e219] [cursor=pointer]:
                  - /url: /ncsu.edu/csedm-dc-2021/home
              - link "Quickstart" [ref=e221] [cursor=pointer]:
