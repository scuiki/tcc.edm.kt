                - text: "Track 1: Knowledge Tracing"
            - paragraph [ref=e133]:
              - strong [ref=e135]: Goal
              - text: ": The goal of this track is to predict a student's performance on a given programming problem before they start it. In this challenge, we define struggle based on the number of attempts that a student makes at solving the problem before getting it correct, if at all. This is explained in detail below."
            - paragraph [ref=e136]
            - paragraph [ref=e137]:
              - strong [ref=e139]: Input
              - text: ": Your trained model should take as input the history of a student's attempts at prior programming problems, including the code of their submissions, and their performance on these problems. This will include data for the first 30 problems (3 assignments) of the semester. This data includes all problem attempts during that time period, the submitted code, and the \"score\" received for each attempt (0-1) indicating how many test cases were passed."
            - paragraph [ref=e140]
            - paragraph [ref=e141]:
              - strong [ref=e143]: Output
              - text: ": The model should predict whether the student will succeed (1) or struggle (0) on each of the final 20 problems (2 semesters) of the semester. These predictions can enable interventions from the instructor and learning environment."
            - paragraph [ref=e144]
            - paragraph [ref=e145]:
              - strong [ref=e147]: Note
              - text: ": Typically, Knowledge Tracing uses a student's performance on problems 1...n to predict performance on problem (n+1). However, in order to facilitate the Data Challenge competition, we needed to split the data into early (first 30 problems) and late (last 20 problems) groups. For example, the model will"
              - emphasis [ref=e149]: not
              - text: have any information about a student's performance on problem 40 when predicting problem 41, only data for problems 1-30.
            - paragraph [ref=e150]
            - paragraph [ref=e151]: "Track 1 Label: Struggle on a Problem"
            - paragraph [ref=e152]: "We define a student as struggling on a given problem (Label = 0) if either of the following are true:"
            - list [ref=e153]:
              - listitem [ref=e154]:
                - paragraph [ref=e155]: They attempted the problem but never got the problem correct.
              - listitem [ref=e156]:
                - paragraph [ref=e157]: They got the problem correct, but they required more attempts to do so than 75% of other students who attempted the problem.
            - paragraph [ref=e158]
            - paragraph [ref=e159]: Therefore, the definition of "struggling" varies from problem to problem, with harder problems allowing more attempts without classifying a student as struggling.
            - paragraph [ref=e160]
            - paragraph [ref=e161]:
              - generic [ref=e162]:
                - text: We chose this definition of struggle for a few reasons, outlined in our
                - link [ref=e163] [cursor=pointer]:
                  - /url: https://www.google.com/url?q=https%3A%2F%2Fgithub.com%2FYangAzure%2FCSEDMDataChallenge%2Fblob%2Fmain%2Fpreprocess.ipynb&sa=D&sntz=1&usg=AOvVaw1ozfxLf1m1cL_z0GhB-bXx
              - link "preprocessing notebook" [ref=e165] [cursor=pointer]:
                - /url: https://www.google.com/url?q=https%3A%2F%2Fgithub.com%2FYangAzure%2FCSEDMDataChallenge%2Fblob%2Fmain%2Fpreprocess.ipynb&sa=D&sntz=1&usg=AOvVaw1ozfxLf1m1cL_z0GhB-bXx
              - text: ":"
            - list [ref=e166]:
              - listitem [ref=e167]:
                - paragraph [ref=e168]: Traditionally in programming practice environments, students are given feedback from test cases after each attempt (as was the case in the CodeWorkout environment), so the number of attempts measures how much of this feedback they need to succeed.
              - listitem [ref=e169]:
                - paragraph [ref=e170]: The number of attempted students needed to complete a problem were generally exponentially distributed with a long tail (name with few attempts, few with many attempts). A 75th percentile on the number of attempts generally separated the tail of this distribution from the main body of students.
              - listitem [ref=e171]:
                - paragraph [ref=e172]:
                  - text: We chose not to use success on the
                  - emphasis [ref=e174]: first
                  - text: attempt, since we hypothesized that students use the autograder in different ways, and not all students are
                  - emphasis [ref=e176]: trying
                  - text: to get the problem correct on their first attempt (e.g. they may just want to see the test cases), so this seemed like an exaggerated definition of struggle.
              - listitem [ref=e177]:
                - paragraph [ref=e178]: We chose not to use overall problem correctness, since most students get most problems correct eventually (~93% of all student/problem pairs were eventually successful in Spring 2019).
              - listitem [ref=e179]:
                - paragraph [ref=e180]: We chose not to use students' test case scores on individual submissions (only whether they got a problem correct eventually), since it was not clear if they could be interpreted as a raw grade (e.g. is each test case equally important?).
              - listitem [ref=e181]:
                - paragraph [ref=e182]: We cannot use time on task, since we do not know when students started working on a given problem.
            - paragraph [ref=e183]
            - paragraph [ref=e184]: We make no claims that this label is objectively correct, but we do argue that it is a meaningful measure of students' success on a given problem, worth predicting, and that the same techniques we develop to predict this value should be useful for predicting other measures.
            - paragraph [ref=e185]: Track 1 Evaluation
            - paragraph [ref=e186]: The primary evaluation metric for Track 1 will be the ROC-AUC value across all student-problem pairs (predictions) for the last 20 problems of the test dataset. The scoring system will also calculate macro F1-score (across both classes) and accuracy for reference.
            - paragraph [ref=e187]
            - paragraph [ref=e188]: "A few notes:"
            - list [ref=e189]:
              - listitem [ref=e190]:
                - paragraph [ref=e191]:
                  - generic [ref=e192]:
                    - text: The code for the evaluation procedure can be
                    - link [ref=e193] [cursor=pointer]:
                      - /url: https://www.google.com/url?q=https%3A%2F%2Fgithub.com%2FYangAzure%2FCSEDMDataChallenge%2Fblob%2Fmain%2FCodaLabPackages%2FTrack1Package%2Fprogram%2Fevaluate.py&sa=D&sntz=1&usg=AOvVaw1vwl2KB53lMC4HCjg94pbx
                  - link "found here" [ref=e195] [cursor=pointer]:
                    - /url: https://www.google.com/url?q=https%3A%2F%2Fgithub.com%2FYangAzure%2FCSEDMDataChallenge%2Fblob%2Fmain%2FCodaLabPackages%2FTrack1Package%2Fprogram%2Fevaluate.py&sa=D&sntz=1&usg=AOvVaw1vwl2KB53lMC4HCjg94pbx
                  - text: .
              - listitem [ref=e196]:
                - paragraph [ref=e197]:
                  - generic [ref=e198]:
                    - text: We chose AUC as a standard competition measure (e.g. used in
                    - link [ref=e199] [cursor=pointer]:
                      - /url: https://www.kaggle.com/c/riiid-test-answer-prediction
                  - link "the RIID competition" [ref=e201] [cursor=pointer]:
                    - /url: https://www.kaggle.com/c/riiid-test-answer-prediction
                  - text: ), which also captures performance at various thresholds for intervention, which reflects the reality of many educational systems (e.g. a low-cost intervention might be deployed for all students with a 20% chance of struggle, while a high-cost intervention might be saved for those with an 80% chance).
            - list [ref=e202]:
              - listitem [ref=e203]:
                - paragraph [ref=e204]:
                  - strong [ref=e206]: Note
                  - text: ": This means that submissions should include"
                  - emphasis [ref=e208]: predicted probabilities
                  - text: (0-1, continuous), not discrete predictions.
            - paragraph [ref=e209]
            - paragraph [ref=e210]: Track 1 Submission
            - paragraph [ref=e211]:
              - generic [ref=e212]:
                - text: Submit Track 1 on CodaLab (via the link in the
