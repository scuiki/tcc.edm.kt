<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1180 640" font-family="Georgia, 'Times New Roman', serif">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#333"/>
    </marker>
    <marker id="arrBlue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#4a78b8"/>
    </marker>
  </defs>

  <!-- ============================================================== -->
  <!-- COLUNA 1: Entradas (paths brutos)                              -->
  <!-- ============================================================== -->
  <text x="40" y="30" font-size="13" font-style="italic">Índices de paths</text>

  <!-- p_0 -->
  <text x="14" y="98" font-size="14" font-style="italic">p₀</text>
  <rect x="40" y="55"  width="58" height="26" rx="4" fill="#fff2c2" stroke="#b8860b"/>
  <text x="69" y="73" text-anchor="middle" font-size="13">s₀</text>
  <rect x="40" y="86"  width="58" height="26" rx="4" fill="#fff2c2" stroke="#b8860b"/>
  <text x="69" y="104" text-anchor="middle" font-size="13">o₀</text>
  <rect x="40" y="117" width="58" height="26" rx="4" fill="#fff2c2" stroke="#b8860b"/>
  <text x="69" y="135" text-anchor="middle" font-size="13">q₀</text>

  <text x="69" y="172" text-anchor="middle" font-size="16">⋮</text>

  <!-- p_R -->
  <text x="14" y="230" font-size="14" font-style="italic">p_R</text>
  <rect x="40" y="190" width="58" height="26" rx="4" fill="#fff2c2" stroke="#b8860b"/>
  <text x="69" y="208" text-anchor="middle" font-size="13">s_R</text>
  <rect x="40" y="221" width="58" height="26" rx="4" fill="#fff2c2" stroke="#b8860b"/>
  <text x="69" y="239" text-anchor="middle" font-size="13">o_R</text>
  <rect x="40" y="252" width="58" height="26" rx="4" fill="#fff2c2" stroke="#b8860b"/>
  <text x="69" y="270" text-anchor="middle" font-size="13">q_R</text>

  <!-- ============================================================== -->
  <!-- COLUNA 2: Embeddings                                           -->
  <!-- ============================================================== -->
  <!-- Embedding de Nó (W_enode) — compartilhado para s e q -->
  <rect x="135" y="80"  width="105" height="60" rx="10" fill="#cfe8c0" stroke="#5a7d4c" stroke-width="1.5"/>
  <text x="187" y="102" text-anchor="middle" font-size="13" font-weight="bold">Embedding</text>
  <text x="187" y="118" text-anchor="middle" font-size="13" font-weight="bold">de Nó</text>
  <text x="187" y="134" text-anchor="middle" font-size="13" font-style="italic">W_enode</text>

  <!-- Embedding de Caminho (W_epath) -->
  <rect x="135" y="195" width="105" height="60" rx="10" fill="#cfe8c0" stroke="#5a7d4c" stroke-width="1.5"/>
  <text x="187" y="217" text-anchor="middle" font-size="13" font-weight="bold">Embedding</text>
  <text x="187" y="233" text-anchor="middle" font-size="13" font-weight="bold">de Caminho</text>
  <text x="187" y="249" text-anchor="middle" font-size="13" font-style="italic">W_epath</text>

  <!-- Arestas: entradas -> embeddings -->
  <line x1="98" y1="68"  x2="135" y2="95"  stroke="#333" marker-end="url(#arr)"/>
  <line x1="98" y1="130" x2="135" y2="125" stroke="#333" marker-end="url(#arr)"/>
  <line x1="98" y1="99"  x2="135" y2="215" stroke="#333" marker-end="url(#arr)"/>
  <line x1="98" y1="203" x2="135" y2="100" stroke="#333" marker-end="url(#arr)"/>
  <line x1="98" y1="265" x2="135" y2="130" stroke="#333" marker-end="url(#arr)"/>
  <line x1="98" y1="234" x2="135" y2="235" stroke="#333" marker-end="url(#arr)"/>

  <!-- ============================================================== -->
  <!-- COLUNA 3: Vetores de embedding por path + x_t                  -->
  <!-- ============================================================== -->
  <text x="305" y="30" font-size="13" font-style="italic">Embeddings (100d cada) + x_t</text>

  <!-- Bloco do path 0 -->
  <rect x="280" y="50"  width="62" height="22" rx="11" fill="#fff2c2" stroke="#b8860b"/>
  <text x="311" y="66" text-anchor="middle" font-size="12">e_s,0</text>
  <rect x="280" y="76"  width="62" height="22" rx="11" fill="#fff2c2" stroke="#b8860b"/>
  <text x="311" y="92" text-anchor="middle" font-size="12">e_o,0</text>
  <rect x="280" y="102" width="62" height="22" rx="11" fill="#fff2c2" stroke="#b8860b"/>
  <text x="311" y="118" text-anchor="middle" font-size="12">e_q,0</text>
  <rect x="280" y="128" width="62" height="22" rx="11" fill="#fff2c2" stroke="#b8860b"/>
  <text x="311" y="144" text-anchor="middle" font-size="12">x_t</text>

  <text x="311" y="172" text-anchor="middle" font-size="16">⋮</text>

  <!-- Bloco do path R -->
  <rect x="280" y="185" width="62" height="22" rx="11" fill="#fff2c2" stroke="#b8860b"/>
  <text x="311" y="201" text-anchor="middle" font-size="12">e_s,R</text>
  <rect x="280" y="211" width="62" height="22" rx="11" fill="#fff2c2" stroke="#b8860b"/>
  <text x="311" y="227" text-anchor="middle" font-size="12">e_o,R</text>
  <rect x="280" y="237" width="62" height="22" rx="11" fill="#fff2c2" stroke="#b8860b"/>
  <text x="311" y="253" text-anchor="middle" font-size="12">e_q,R</text>
  <rect x="280" y="263" width="62" height="22" rx="11" fill="#fff2c2" stroke="#b8860b"/>
  <text x="311" y="279" text-anchor="middle" font-size="12">x_t</text>

  <!-- Arestas: embeddings -> per-path vectors -->
  <line x1="240" y1="100" x2="280" y2="61"  stroke="#333" marker-end="url(#arr)"/>
  <line x1="240" y1="115" x2="280" y2="113" stroke="#333" marker-end="url(#arr)"/>
  <line x1="240" y1="225" x2="280" y2="87"  stroke="#333" marker-end="url(#arr)"/>

  <line x1="240" y1="120" x2="280" y2="196" stroke="#333" marker-end="url(#arr)"/>
  <line x1="240" y1="130" x2="280" y2="248" stroke="#333" marker-end="url(#arr)"/>
  <line x1="240" y1="230" x2="280" y2="222" stroke="#333" marker-end="url(#arr)"/>

  <!-- Rótulo "Concatenar" -->
  <text x="395" y="40" font-size="13" font-style="italic">Concatenar</text>

  <!-- ============================================================== -->
  <!-- COLUNA 4: e_0 ... e_R (matriz E)                               -->
  <!-- ============================================================== -->
  <!-- e_0 -->
  <circle cx="430" cy="100" r="20" fill="#cfe2f3" stroke="#4a78b8" stroke-width="1.5"/>
  <text x="430" y="105" text-anchor="middle" font-size="13">e₀</text>
  <text x="466" y="105" font-size="13">320</text>

  <!-- e_1 -->
  <circle cx="430" cy="155" r="20" fill="#cfe2f3" stroke="#4a78b8" stroke-width="1.5"/>
  <text x="430" y="160" text-anchor="middle" font-size="13">e₁</text>

  <text x="430" y="195" text-anchor="middle" font-size="16">⋮</text>

  <!-- e_{R-1} -->
  <circle cx="430" cy="220" r="22" fill="#cfe2f3" stroke="#4a78b8" stroke-width="1.5"/>
  <text x="430" y="225" text-anchor="middle" font-size="11">e_{R-1}</text>

  <!-- e_R -->
  <circle cx="430" cy="270" r="20" fill="#cfe2f3" stroke="#4a78b8" stroke-width="1.5"/>
  <text x="430" y="275" text-anchor="middle" font-size="13">e_R</text>
  <text x="430" y="307" text-anchor="middle" font-size="14" font-weight="bold">E</text>

  <!-- Arestas: per-path concat -> e_i -->
  <line x1="342" y1="97"  x2="410" y2="100" stroke="#333" marker-end="url(#arr)"/>
  <line x1="342" y1="232" x2="410" y2="270" stroke="#333" marker-end="url(#arr)"/>

  <!-- ============================================================== -->
  <!-- COLUNA 5: Camada de Atenção + SoftMax                          -->
  <!-- ============================================================== -->
  <rect x="510" y="75" width="120" height="80" rx="12" fill="#cfe8c0" stroke="#5a7d4c" stroke-width="1.5"/>
  <text x="570" y="100" text-anchor="middle" font-size="13" font-weight="bold">Camada de</text>
  <text x="570" y="118" text-anchor="middle" font-size="13" font-weight="bold">Atenção</text>
  <text x="570" y="138" text-anchor="middle" font-size="11">tanh · W_path</text>
  <text x="570" y="151" text-anchor="middle" font-size="11">+ Linear W_a</text>

  <!-- arestas E -> Attention -->
  <line x1="450" y1="100" x2="510" y2="100" stroke="#333" marker-end="url(#arr)"/>
  <line x1="450" y1="155" x2="510" y2="115" stroke="#333" marker-end="url(#arr)"/>
  <line x1="450" y1="220" x2="510" y2="130" stroke="#333" marker-end="url(#arr)"/>
  <line x1="450" y1="270" x2="510" y2="145" stroke="#333" marker-end="url(#arr)"/>

  <!-- SoftMax -->
  <text x="660" y="60" font-size="13" font-style="italic">SoftMax</text>
  <text x="660" y="76" font-size="11" font-style="italic">(sobre R)</text>
  <circle cx="680" cy="110" r="22" fill="#cfe2f3" stroke="#4a78b8" stroke-width="1.5"/>
  <text x="680" y="115" text-anchor="middle" font-size="14">α</text>
  <line x1="630" y1="115" x2="658" y2="115" stroke="#333" marker-end="url(#arr)"/>

  <!-- ============================================================== -->
  <!-- COLUNA 6: Produto + soma ponderada → z_t                       -->
  <!-- ============================================================== -->
  <!-- Símbolo do produto -->
  <g transform="translate(750,235)">
    <circle r="22" fill="#cfe2f3" stroke="#4a78b8" stroke-width="1.5"/>
    <line x1="-15" y1="-15" x2="15" y2="15" stroke="#4a78b8" stroke-width="1.5"/>
    <line x1="-15" y1="15"  x2="15" y2="-15" stroke="#4a78b8" stroke-width="1.5"/>
  </g>
  <text x="750" y="285" text-anchor="middle" font-size="13">Soma ponderada</text>
  <text x="750" y="300" text-anchor="middle" font-size="11" font-style="italic">Σᵢ αᵢ · eᵢ</text>

  <!-- arestas para o produto -->
  <line x1="680" y1="132" x2="745" y2="225" stroke="#333" marker-end="url(#arr)"/>
  <line x1="450" y1="300" x2="730" y2="245" stroke="#333" stroke-dasharray="3,2" marker-end="url(#arr)"/>

  <!-- ============================================================== -->
  <!-- COLUNA 7: LSTM ao longo do tempo                               -->
  <!-- ============================================================== -->
  <text x="845" y="30" font-size="13" font-style="italic">Vetor de</text>
  <text x="845" y="46" font-size="13" font-style="italic">Código</text>
  <text x="915" y="30" font-size="13" font-style="italic">Vetor de</text>
  <text x="915" y="46" font-size="13" font-style="italic">Correção</text>
  <text x="1110" y="40" font-size="13" font-style="italic" text-anchor="end">Resultado de</text>
  <text x="1110" y="56" font-size="13" font-style="italic" text-anchor="end">Predição</text>

  <!-- z_t (saída do produto) -->
  <line x1="772" y1="235" x2="838" y2="100" stroke="#4a78b8" marker-end="url(#arrBlue)"/>

  <!-- LSTM bloco -->
  <rect x="975" y="80" width="80" height="380" rx="14" fill="#cfe8c0" stroke="#5a7d4c" stroke-width="1.5"/>
  <text x="1015" y="275" text-anchor="middle" font-size="20" font-weight="bold">LSTM</text>

  <!-- Pares (z_t, x_t) ao longo do tempo -->
  <!-- t=1 -->
  <ellipse cx="855" cy="100" rx="22" ry="16" fill="#cfe2f3" stroke="#4a78b8" stroke-width="1.5"/>
  <text x="855" y="105" text-anchor="middle" font-size="13">z₁</text>
  <ellipse cx="920" cy="100" rx="22" ry="16" fill="#cfe2f3" stroke="#4a78b8" stroke-width="1.5"/>
  <text x="920" y="105" text-anchor="middle" font-size="13">x₁</text>
  <line x1="942" y1="100" x2="975" y2="100" stroke="#333" marker-end="url(#arr)"/>
  <line x1="877" y1="100" x2="898" y2="100" stroke="#333" marker-end="url(#arr)"/>
  <line x1="1055" y1="100" x2="1090" y2="100" stroke="#333" marker-end="url(#arr)"/>
  <circle cx="1115" cy="100" r="18" fill="#cfe2f3" stroke="#4a78b8" stroke-width="1.5"/>
  <text x="1115" y="105" text-anchor="middle" font-size="13">y₁</text>

  <!-- t=2 -->
  <ellipse cx="855" cy="170" rx="22" ry="16" fill="#cfe2f3" stroke="#4a78b8" stroke-width="1.5"/>
  <text x="855" y="175" text-anchor="middle" font-size="13">z₂</text>
  <ellipse cx="920" cy="170" rx="22" ry="16" fill="#cfe2f3" stroke="#4a78b8" stroke-width="1.5"/>
  <text x="920" y="175" text-anchor="middle" font-size="13">x₂</text>
  <line x1="877" y1="170" x2="898" y2="170" stroke="#333" marker-end="url(#arr)"/>
  <line x1="942" y1="170" x2="975" y2="170" stroke="#333" marker-end="url(#arr)"/>
  <line x1="1055" y1="170" x2="1090" y2="170" stroke="#333" marker-end="url(#arr)"/>
  <circle cx="1115" cy="170" r="18" fill="#cfe2f3" stroke="#4a78b8" stroke-width="1.5"/>
  <text x="1115" y="175" text-anchor="middle" font-size="13">y₂</text>

  <text x="855" y="215" text-anchor="middle" font-size="16">⋮</text>
  <text x="920" y="215" text-anchor="middle" font-size="16">⋮</text>
  <text x="1115" y="215" text-anchor="middle" font-size="16">⋮</text>

  <!-- t -->
  <ellipse cx="855" cy="260" rx="22" ry="16" fill="#cfe2f3" stroke="#4a78b8" stroke-width="1.5"/>
  <text x="855" y="265" text-anchor="middle" font-size="13">z_t</text>
  <ellipse cx="920" cy="260" rx="22" ry="16" fill="#cfe2f3" stroke="#4a78b8" stroke-width="1.5"/>
  <text x="920" y="265" text-anchor="middle" font-size="13">x_t</text>
  <line x1="877" y1="260" x2="898" y2="260" stroke="#333" marker-end="url(#arr)"/>
  <line x1="942" y1="260" x2="975" y2="260" stroke="#333" marker-end="url(#arr)"/>
  <line x1="1055" y1="260" x2="1090" y2="260" stroke="#333" marker-end="url(#arr)"/>
  <circle cx="1115" cy="260" r="18" fill="#cfe2f3" stroke="#4a78b8" stroke-width="1.5"/>
  <text x="1115" y="265" text-anchor="middle" font-size="13">y_t</text>

  <text x="855" y="305" text-anchor="middle" font-size="16">⋮</text>
  <text x="920" y="305" text-anchor="middle" font-size="16">⋮</text>
  <text x="1115" y="305" text-anchor="middle" font-size="16">⋮</text>

  <!-- T -->
  <ellipse cx="855" cy="345" rx="22" ry="16" fill="#cfe2f3" stroke="#4a78b8" stroke-width="1.5"/>
  <text x="855" y="350" text-anchor="middle" font-size="13">z_T</text>
  <ellipse cx="920" cy="345" rx="22" ry="16" fill="#cfe2f3" stroke="#4a78b8" stroke-width="1.5"/>
  <text x="920" y="350" text-anchor="middle" font-size="13">x_T</text>
  <line x1="877" y1="345" x2="898" y2="345" stroke="#333" marker-end="url(#arr)"/>
  <line x1="942" y1="345" x2="975" y2="345" stroke="#333" marker-end="url(#arr)"/>
  <line x1="1055" y1="345" x2="1090" y2="345" stroke="#333" marker-end="url(#arr)"/>
  <circle cx="1115" cy="345" r="18" fill="#cfe2f3" stroke="#4a78b8" stroke-width="1.5"/>
  <text x="1115" y="350" text-anchor="middle" font-size="13">y_T</text>

  <!-- Indicador concat -->
  <text x="897" y="395" text-anchor="middle" font-size="11" font-style="italic">concat</text>
  <text x="897" y="410" text-anchor="middle" font-size="11" font-style="italic">(340d)</text>

  <!-- Saída Sigmoid + FC -->
  <text x="1115" y="395" text-anchor="middle" font-size="11" font-style="italic">Sigmoid</text>
  <text x="1115" y="410" text-anchor="middle" font-size="11" font-style="italic">FC → M</text>

  <!-- ============================================================== -->
  <!-- Anotações dimensionais e legendas                              -->
  <!-- ============================================================== -->
  <text x="40" y="490" font-size="13"><tspan font-weight="bold">Dimensões</tspan> (M=10 problemas, R=50 paths):</text>
  <text x="40" y="510" font-size="12">• Entradas: sᵢ, oᵢ, qᵢ = índices inteiros (PAD/UNK reservados em 0)</text>
  <text x="40" y="528" font-size="12">• Embeddings: |e_s|=|e_q|=|e_o|=100;  x_t = one-hot (ProblemID, acerto/erro) de dim 2M=20</text>
  <text x="40" y="546" font-size="12">• Por path: eᵢ = concat(e_s,i, e_q,i, e_o,i, x_t) ∈ ℝ³²⁰</text>
  <text x="40" y="564" font-size="12">• Vetor de código z_t = Σᵢ αᵢ · eᵢ ∈ ℝ³²⁰;  Entrada LSTM = concat(x_t, z_t) ∈ ℝ³⁴⁰</text>
  <text x="40" y="582" font-size="12">• Saída y_t ∈ [0,1]^M — probabilidade de acerto por problema do assignment</text>

  <!-- Legenda -->
  <text x="40" y="618" font-size="15" font-weight="bold">Figura 3:</text>
  <text x="115" y="618" font-size="15">Estrutura do modelo Code-DKT (implementação deste trabalho).</text>
</svg>
